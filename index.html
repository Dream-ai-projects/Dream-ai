<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Waifu - Full Body</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="blush-overlay"></div>
    <div id="affection-container"><div id="affection-fill"></div></div>

    <div id="avatar-box">
        <canvas id="vrm-canvas"></canvas>
    </div>

    <div id="waifu-app">
        <div id="chat-container"></div>
        <div id="input-area">
            <input id="msg" type="text" placeholder="Talk to your waifu...">
            <button id="send-btn">💖</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>
    <script src="script.js"></script>
</body>
</html>
