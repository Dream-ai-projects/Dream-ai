<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Waifu - Mobile God Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="debug-log">Status: Initializing...</div>

    <div id="blush-overlay"></div>
    
    <div id="settings-menu" class="hidden">
        <h3>Waifu Settings</h3>
        <label>Personality:</label>
        <select id="pers-select">
            <option value="horny">🔥 Spicy/Horny</option>
            <option value="girlfriend">💖 Girlfriend</option>
        </select>
        <button onclick="clearMemory()" style="background:red">Wipe Memory</button>
        <button onclick="toggleSettings()">Close</button>
    </div>

    <div id="avatar-box">
        <canvas id="vrm-canvas"></canvas>
    </div>

    <div id="waifu-app">
        <div id="chat-container"></div>
        <div id="input-area">
            <button id="set-btn" onclick="toggleSettings()">⚙️</button>
            <input id="msg" type="text" placeholder="Talk to her...">
            <button id="send-btn">💋</button>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.126.1/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.126.1/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.11/lib/three-vrm.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
